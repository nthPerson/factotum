<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factotum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230f766e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="dot"></span>Factotum <small id="today-label"></small></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="today" aria-selected="true">Today<span class="n" id="n-today"></span></button>
      <button role="tab" data-tab="timeline" aria-selected="false">Timeline</button>
      <button role="tab" data-tab="projects" aria-selected="false">Projects</button>
      <button role="tab" data-tab="review" aria-selected="false">Review<span class="n" id="n-review"></span></button>
      <button role="tab" data-tab="chat" aria-selected="false">Chat</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <div class="spacer"></div>
    <div class="remind" id="remind"></div>
  </header>
  <main>
    <aside class="rail collapsed" id="rail"></aside>
    <div class="panel" id="panel"><div class="empty">Loading…</div></div>
  </main>
  <div class="tray" id="tray">
    <button class="summary" id="tray-toggle" aria-expanded="false" title="Show the changes"><span class="count" id="tray-count">0 changes</span><span class="list" id="tray-list"></span><span class="caret">▴</span></button>
    <button class="btn" id="tray-discard">Discard all</button>
    <button class="btn primary" id="tray-apply">Apply all</button>
    <div class="tray-panel" id="tray-panel" hidden></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
