[project]
name = "factotum"
version = "0.1.0"
description = "A self-hosted task triage service: Plaud recordings, Canvas, email and calendar in; a short, honest task list out."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["factotum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# starlette's test client warns about httpx until httpx2 is the default; not ours to fix
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
