# Factotum configuration: the reference.
#
# This file documents every key Factotum reads. It is a reference, not a setup: Factotum never
# loads it unless FACTOTUM_CONFIG names it. To make Factotum your own, copy it to
# config/factotum.yaml, replace the placeholders (Your Name, you@example.com, example.edu,
# YOUR_DATABASE_ID …), switch on what you have set up, and restart Factotum. Without
# config/factotum.yaml Factotum runs on config/factotum.starter.yaml (no name, no addresses,
# everything off) and says so.
#
# - Secrets never go here; they go in .env (see .env.example and docs/SETUP.md §8).
# - A comment that names "Settings → <section>" means the Settings tab has a control for that key.
#   A change made there is stored in the database and wins over this file from then on, so edit
#   such a key in Settings once it has been touched there. Every other key is changed only here
#   (restart Factotum after editing). `python -m factotum effective` prints each Settings key's
#   value and where it comes from (docs/SETUP.md §18).
# - Values marked `# taste` are preferences with no right answer: start with these, change them
#   when they feel wrong.
# - "§N" below is a section of docs/SETUP.md, which sets up the integration the key belongs to.

owner:
  name: "Your Name"             # whose setup this is; for your reference (nothing reads it yet)
  timezone: ""                  # an IANA zone such as Europe/Paris; empty = this machine's time zone. Every daily time below is in it
  # addresses that identify you: the mail sweep recognises your sent replies by them, and the
  # connector's consent page (§16) lets in only these
  emails: [you@example.com, you@example.edu]

taxonomy:
  areas: [Personal, Academics, Work, Research]   # every project belongs to one; a recording's note and tasks carry it
  # Projects a recording, a mail or a Canvas item can file under. The sync run reads each
  # description to decide where something goes, so say what belongs in a project and, where two
  # are close, what does not.
  # weight: high | medium | low (points in scoring.project_weights); never_fade: true = its undated
  # tasks never fade (lifecycle.fade_days does not apply)
  projects:
    - name: Course 101
      area: Academics
      weight: high
      description: "One course this term: its lectures, assignments, quizzes, exams and study sessions. Degree paperwork goes to Thesis, not here."
    - name: Thesis
      area: Research
      weight: high
      never_fade: true
      description: "The thesis: research questions, experiments, writing, the committee and the defense. Lab duties that are not thesis work go to Lab work."
    - name: Lab work
      area: Research
      weight: medium
      description: "The lab's own work: lab meetings, shared equipment, data collection for others, onboarding. Your own research goes to Thesis."
    - name: Side project
      area: Work
      weight: low
      description: "A project of your own outside school: its product, code, users and partners."
    - name: Personal
      area: Personal
      weight: high
      description: "Personal life not tied to work, school or research: health, insurance, errands, money, home, travel, goals."
    - name: Unknown
      area: Work
      weight: medium
      description: "ONLY work, school or research with no identifiable project. Never a personal note: that is Personal."
  efforts: [XS, S, M, L]        # the effort sizes a task may carry; scoring.quick_win and scoring.start_now name them
  # Tie-breakers the sync run applies when a recording could file under two projects (§9).
  tie_breakers: |
    - Prefer the most specific project.
    - Thesis vs Lab work: your own research questions, experiments and writing are Thesis; the lab's meetings and shared duties are Lab work, even when your advisor runs both.
    - Course 101 vs Thesis: the course's content (lectures, assignments, exams, study) is Course 101; degree paperwork and the committee are Thesis.
    - If Area is Personal, Project is always Personal, never Unknown.
  # Note page classification (the Notion notes sink's Type and Tags options, §5).
  note_types:
    - { name: Meeting,    description: any multi-person meeting, call or group discussion; prefer Meeting whenever the transcript shows more than one genuine participant }
    - { name: Reminder,   description: a memo whose purpose is to manage the task list or calendar, or a short note-to-self }
    - { name: Goal,       description: goal-setting or objective planning }
    - { name: Research,   description: research thinking, paper discussion, experiment notes }
    - { name: Dev,        description: software design or debugging notes }
    - { name: Client,     description: a client or partner conversation }
    - { name: Lecture,    description: a recorded class session }
    - { name: Coursework, description: assignment or study work for a course }
    - { name: Personal,   description: personal-life content }
  note_tags:
    - { name: Meeting,   description: a multi-person meeting or call }
    - { name: Idea,      description: contains ideas or brainstorming }
    - { name: Task,      description: contains actionable to-dos }
    - { name: Follow-up, description: contains items to circle back on }
    - { name: Personal,  description: contains goals or introspection }

lifecycle:                      # Settings → Review and lifecycle has a control for every key here but the last two
  fade_days: 21                 # taste: undated backlog fades after this many quiet days (a new mention resets the clock)
  fade_warn_days: 3             # taste: a task shows in Review this many days before it fades
  last_call_days: 7             # taste: hard deadlines this far past due get one Last call in Review, then lapse
  top_cap: 7                    # taste: soft cap on the Top rail
  review_cap: 15                # taste: max items per Review session
  expire_time: "03:30"          # when the daily fade / lapse pass runs (local time); it touches only rows Review has shown
  resurrect_on_mention: true    # documents today's behaviour: a new mention brings a faded task back (the code does not read this yet)

scoring:                        # taste: every number in this block. Priority is computed from these; Settings has no control for them yet
  project_weights: { high: 15, medium: 5, low: 0 }   # points a project's weight adds
  hard: { overdue: 100, today: 90, d2: 80, d7: 60, d14: 40, later: 20 }   # a hard deadline's points by how near it is
  soft_penalty: 15              # a soft (non-hard) date scores this much less than a hard one as near
  soft_overdue: { start: 70, decay_per_day: 5, floor: 25 }   # a missed soft date: starts here, loses points each day, never below the floor
  undated: 15                   # an undated task
  undated_longterm: 10          # an undated task marked long-term
  mention_bonus: 5              # each mention after the first adds this…
  mention_cap: 15               # …up to this
  owed_bonus: 10                # a task with a counterpart, or one waiting on someone
  quick_win: { efforts: [XS, S], within_days: 3, bonus: 5 }    # small tasks due soon
  start_now: { efforts: [L], within_days: 7, bonus: 10 }       # large tasks that must start now to finish in time
  manual: { P0_floor: 85, P1_floor: 65, P3_cap: 40 }           # a priority you set by hand keeps the score within these
  bands: { P0: 80, P1: 60, P2: 35 }                            # score → priority band; below P2 is P3

sources:
  plaud:                        # Plaud recordings (§2 the plaud CLI, §9 the trigger mail)
    enabled: false              # Settings → Inputs. On = every recording is one headless Claude run (≈ $0.15, at most claude.budgets_usd.sync_file) that writes tasks and, with the notes sink, a Notion page
    trigger_account: you@example.com   # the mailbox Plaud's "AutoFlow" mail arrives in, for your reference; the one watched is IMAP_USER in .env (§9)
    from_filter: plaud.ai                       # IMAP search narrowing (substring)
    sender: no-reply@plaud.ai                   # the parsed From must equal this, and the mail must carry…
    auth_server: mx.google.com                  # …this server's Authentication-Results with DKIM/DMARC pass for its domain
    subject_prefix: "[Plaud-AutoFlow]"          # the subject the trigger mail starts with
    cli: plaud                                  # @plaud-ai/cli; give the absolute path (`which plaud`): the service has systemd's minimal PATH
    extraction:
      max_undated_per_recording: 3              # undated tasks one recording may create; the rest are dropped
  canvas:                       # Canvas LMS (§10); CANVAS_TOKEN in .env
    enabled: false              # Settings → Inputs. On = Canvas is read every sweep; new items become hard-deadline tasks and submitted ones close. No Claude run, no cost
    base_url: https://canvas.example.edu   # your school's Canvas address
    days_back: 7                # items due this many days ago are still read (to close what was submitted)
    days_ahead: 90              # and this far ahead
    sweep_minutes: 60           # Settings → Inputs: how often items are pulled and submitted ones closed
    course_map: { COURSE101: Course 101 }   # a course whose Canvas name starts with this code (spaces ignored) → the project its items file under
    effort_by_type: { Quiz: S, Discussion: S, Assignment: M, Project: L }   # the effort a new item gets by its Canvas type
    skip_title_prefixes: ["Attendance:"]    # items whose title starts with one of these never become tasks
    skip_context_patterns: ["*Example Department*"]   # courses / groups whose name matches (glob) are never read
  mail:                         # mail through Mailbird's MCP server, read-only (§3, §10); MAILBIRD_TOKEN in .env
    enabled: false              # Settings → Inputs. On = monitored accounts are read every sweep: replies flip Waiting, sent replies close tasks. Sends nothing, no Claude run
    provider: mailbird          # mailbird | none
    url: https://127.0.0.1:52000/mcp
    tls_verify: false           # Mailbird uses a self-signed certificate on loopback; never turn verification off for any other URL
    sweep_minutes: 20           # Settings → Inputs: how often mail is swept
    lookback_days: 3            # how far the first pass over an account looks back
    max_per_sweep: 60           # conversations read per folder per pass
    suggest:                    # tasks suggested from mail (SPEC §8.5)
      enabled: false            # Settings → Inputs. On = new Inbox mail about no task is read by one light Claude run (≈ $0.14 per batch) and what you have to do becomes a suggestion card in Review
      minutes: 30               # Settings → Inputs: that run happens only when there is new mail, and no more often than this
      backfill_days: 3          # the first pass over a mailbox also takes mail of the last days that is still unread
      only_unread: false        # true = mail already read is never a candidate
      max_per_sweep: 20         # candidates kept per sweep
      skip_senders: ["*noreply*", "*no-reply*", "*no_reply*", "*donotreply*", "*do-not-reply*", "*newsletter*", "*mailer-daemon*",
                     "*notifications@*", "*notification@*", "*marketing@*", "*news@*", "*digest@*"]   # never candidates (allow / deny below still apply)
    # Accounts are managed in Settings → Email accounts (table `accounts`); this list seeds that table
    # once, the first time Factotum starts on this file. Roles: monitor (the sweep reads it),
    # brief_recipient, plaud_trigger.
    seed_accounts:
      - { address: you@example.edu, display: School,   roles: [monitor] }
      - { address: you@example.com, display: Personal, roles: [monitor, brief_recipient, plaud_trigger] }
    allow: ["*@example.edu", "*@*.example.edu", "*@instructure.com", "*@*.instructure.com", "*"]   # senders the sweep looks at (glob on address or display name)
    deny:                       # senders it never looks at, even when allowed
      - "newsletter@example.edu"
      - "*Example Athletics*"
  slack:                        # Slack, read-only (§12)
    enabled: false              # Settings → Inputs. On = Chat and the skills can search and read; the sweep turns @-mentions of you into Review items. Never posts, no Claude run
    sweep_minutes: 20           # Settings → Inputs: the mention sweep's interval
    lookback_days: 2            # how far the first pass of a workspace looks back
    max_channels: 40            # joined channels read per workspace per pass (one page of history each)
    workspaces:                 # one entry per workspace; the token lives in .env under the name token_env gives;
                                # `project` is where a task created from a mention files; `channels: [..]` limits the sweep
      - { name: Example Lab, token_env: SLACK_TOKEN_EXAMPLE, project: Lab work }
  discord:                      # Discord, read-only (§13)
    enabled: false              # Settings → Inputs. On = Chat can list channels and read recent messages; one bot (DISCORD_BOT_TOKEN in .env) invited to each server below
    guilds:                     # server ids: Discord → User Settings → Advanced → Developer Mode, then right-click the server → Copy Server ID
      - { name: Example server, id: "000000000000000000" }
  calendar:                     # Google Calendar, read-only (§6)
    enabled: false              # Settings → Inputs. On = passed events are checked and the next days shown in the brief; needs the credentials below
    provider: google            # google | none
    credentials_file: config/google-credentials.json   # OAuth "Desktop app" client, downloaded from Google Cloud
    token_file: config/google-token.json               # written by `python -m factotum google-auth`
    calendar_id: primary        # Settings → Inputs
    days_ahead: 14              # how far ahead events are read
    sweep_minutes: 30           # Settings → Inputs: how often passed events are checked and the look-ahead refreshed

sinks:
  notion_notes:                 # one Notion page per recording (§5); NOTION_TOKEN in .env
    enabled: false              # Settings → Outputs. On = every synced recording writes a page into the database below
    database_id: YOUR_DATABASE_ID          # the notes database (from its Notion URL)
    data_source_id: YOUR_DATA_SOURCE_ID    # its data source (Notion → the database's ⋯ → Manage data sources → Copy data source ID)
    source_link_prefix: https://web.plaud.ai/file/   # a note's Source Link is this plus the recording id
    # property names in the notes database, in case yours differ
    properties: { title: Name, date: Date, source_link: Source Link, area: Area, type: Type, project: Project, tags: Tags, meeting_date: Meeting Date, tasks: Tasks }
  notion_tasks_mirror:          # a one-way copy of every task row in Notion (§5); never read back
    enabled: false              # Settings → Outputs. On = every task row edited since the last pass is written to the database below
    sweep_minutes: 10           # Settings → Outputs: how often rows edited since the last pass are pushed
    database_id: YOUR_TASKS_DATABASE_ID
    data_source_id: YOUR_TASKS_DATA_SOURCE_ID
    # property names in the Notion Tasks database, in case yours differ
    properties:
      title: Name
      task_id: Task ID
      status: Status
      project: Project
      area: Area
      due: Due
      hard: Hard deadline
      effort: Effort
      source: Source
      source_key: Source Key
      source_link: Source Link
      context: Context
      why_now: Why now
      score: Score
      priority: Priority
      mentions: Mentions
      completed: Completed
      waiting_on: Waiting On
      calendar_event: Calendar Event
      notes_relation: Notes
    status_map: { open: Next, done: Done, dropped: Dropped, faded: Dropped, lapsed: Dropped }   # Factotum status → the Notion Status option

notify:
  provider: ntfy                # Settings → Notifications. Where reminders and the evening review nudge go: ntfy (its app and the topic below), app (Factotum's own notifications, on every device where they were turned on in Settings) or both
  app:                          # Factotum's own notifications (Settings → Notifications)
    push_hosts: []              # extra push services a browser may subscribe through, exact host names (e.g. [push.example.net]); Google's, Mozilla's, Apple's and Microsoft's need nothing here. The server posts only to these, never to an IP address or localhost. Not a Settings key
  ntfy:                         # push notifications through ntfy (§4); NTFY_TOKEN in .env
    enabled: false              # Settings → Outputs. On = reminders and the review push are sent to the topic below; anyone who knows the topic can read them
    server: https://ntfy.sh
    topic: ""                   # Settings → Outputs; e.g. factotum-7f3a9c2e (a random, unguessable name)
    tap_opens_app: false        # a reminder tap shows the message and its Snooze / Done / Open buttons in ntfy; true = jump straight to the app
  review_time: "19:30"          # taste: the daily review push. Settings → Review and lifecycle
  snooze_presets: ["30m", "1h", "tomorrow 9am"]   # the Snooze choices on a reminder
  morning_brief:                # one mail a day over SMTP (SMTP_* in .env, or the IMAP_* account; §8, §10)
    enabled: false              # Settings → Outputs. On = one mail every morning to the address below; with claude.planner.enabled it costs one planner run
    time: "06:30"               # taste: when the brief is sent. Settings → Outputs
    to: you@example.com         # Settings → Outputs

claude:                         # headless `claude -p` runs (§2 for the CLI; `factotum claude-check` tests the login)
  binary: claude                # absolute path (`which claude`): the service has systemd's minimal PATH
  models: { sync_file: sonnet, today_summary: sonnet, mail_triage: sonnet, planner_morning: sonnet, chat_turn: sonnet, check: haiku }   # the model per run kind
  budgets_usd: { sync_file: 1.00, today_summary: 0.30, mail_triage: 0.40, planner_morning: 0.75, chat_turn: 0.60, check: 0.05 }   # the most one run may spend; chat_turn: Settings → Claude
  planner: { enabled: false }   # Settings → Claude. On = one Claude run before the brief (≈ $0.10, at most budgets_usd.planner_morning): the verdict, why-now lines and proposals; off = the plain brief
  summary: { auto: false, auto_minutes: 10 }   # Settings → Claude. auto on = the Today tab's summary is rewritten by one light run (≈ $0.18) when it goes stale,
                                # at most every auto_minutes; off = a badge and the Refresh button only
  timeouts_s: { sync_file: 600, today_summary: 180, mail_triage: 240, planner_morning: 480, chat_turn: 240 }   # seconds before a run is stopped
  # max_turns: { sync_file: 40 }   # turns a run kind may take; 40 for every kind not named

server:
  host: 127.0.0.1               # where the app listens; keep it on loopback behind the tunnel (§7)
  port: 8750
  public_url: https://factotum.example.com   # the address the tunnel serves (§7); links in pushes and the brief, and the connector's address, use it
  mcp_writes: stage             # Settings → Connections. What a skill or connector may do with tasks: `stage` = a batch waits in the tray for Apply;
                                # `apply` = apply_changes writes at once (still one undoable batch in the Log)
  mcp_apply_hourly_cap: 100     # direct changes (apply mode) allowed per hour; beyond it Claude must stage
  # mcp_http_tools: [mail_draft_new]   # extra tools for /mcp (§14): a list, or "all"; absent = the read tools and stage_changes only
  oauth:                        # claude.ai / Claude Desktop custom connector: Factotum is its own OAuth server (§16)
    enabled: false              # Settings → Connections. On = a connector you approve can read your tasks, mail and calendar through /mcp at public_url
    consent_gate: cloudflare_access   # the consent page verifies Cloudflare Access's signed assertion (team + aud below) and needs an owner.emails address; `none` only on a port nobody else reaches
    access_team: ""             # the Zero Trust team name: the <team> in https://<team>.cloudflareaccess.com
    access_aud: ""              # the Access application's Audience (AUD) tag: Zero Trust → Access → Applications → Factotum → Overview
    redirect_uris: ["https://claude.ai/api/mcp/auth_callback", "https://claude.com/api/mcp/auth_callback"]
    cimd_hosts: [claude.ai, claude.com]   # hosts whose published client documents may serve as a client_id (the dialog's recommended option)
    access_token_hours: 24
    refresh_token_days: 90
