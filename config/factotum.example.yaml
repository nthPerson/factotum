# Factotum configuration — copy to config/factotum.yaml and edit.
#
# This file is the whole "shape" of one person's workflow: their projects and weights, which
# inputs are on, which sinks are on, when to be reminded. Secrets never go here; they go in
# .env (see .env.example). Values under `lifecycle`, `notify` and the `enabled` flags can also be
# changed from the Settings tab, which stores overrides in the database; the Settings tab names
# this file so a new user knows where the defaults live.

owner:
  name: Robert
  timezone: America/Los_Angeles
  # addresses that identify the owner (used by the mail sweep to recognise sent replies)
  emails:
    - rashe7414@sdsu.edu
    - robertashe2.0@gmail.com
    - nthperson.dev@gmail.com

taxonomy:
  areas: [Personal, Academics, Work, Research]
  # weight: high | medium | low  (see scoring.project_weights)
  projects:
    - name: BDA M.S.
      area: Academics
      weight: high
      never_fade: true
      description: "SDSU Big Data Analytics M.S. degree ADMIN only: program of study, electives approval, advising, candidacy, BDA 600 capstone / BDA 799A thesis logistics, graduation. Course content goes to the course; thesis research goes to its research project."
    - name: GEOG 582
      area: Academics
      weight: high
      description: "Fall 2026 course Intro to GIS Programming (Atsushi Nara): GIS programming, spatial Python, ArcPy/QGIS/GDAL/GeoPandas, this course's lectures, assignments, projects."
    - name: COMPE 510
      area: Academics
      weight: high
      description: "Fall 2026 course Machine Learning for Engineers (Dr. Junfei Xie): lectures, assignments, exams, study sessions. Course content files here even though it is also the SCIBER-CT ARX course."
    - name: BDA 696
      area: Academics
      weight: high
      description: "Fall 2026 course Process & Model Big Data (Ryan Lafler): pipelines, SQL/Spark-style processing, modeling at scale, the group project."
    - name: SCIBER-CT
      area: Academics
      weight: high
      never_fade: true
      description: "SCIBER-CT, pronounced \"cyber city\": SDSU's NSF Research Traineeship (NRT) graduate certificate; Robert is an inaugural-cohort NRT Fellow. Program matters only: certificate course planning, ARX framework, workshops, Summer 2027 internship, hackathon, symposium, cohort sessions, stipend/PaymentWorks, CITI training, travel, Max (program manager), Dr. Haririan/Akhavian as director."
    - name: DiCE Lab
      area: Research
      weight: high
      description: "Data-informed Construction Engineering Lab (Dr. Akhavian, SDSU), the lab's OWN work: lab meetings, robotics, AR/VR/XR, data collection, field testing, human-robot collaboration in construction."
    - name: Caltrans
      area: Research
      weight: high
      description: "Driver-distraction research: outdoor advertising displays, the driving simulator."
    - name: Evidential Deep Learning
      area: Research
      weight: high
      never_fade: true
      description: "Construction digital twins, dynamic digital twin, evidential deep learning for construction, Scan-to-BIM."
    - name: FAMAIL
      area: Research
      weight: low
      description: "Fairness-aware (multi-agent) imitation learning research: GAIL, KDD paper, fairness metrics, trajectory editing, FATE."
    - name: ZIP Launchpad
      area: Work
      weight: high
      description: "SDSU's ZIP Launchpad startup incubator program: cohort workshops, mentors, Lavin Seed Fund, startup-week events, the Car Sounds venture's program obligations."
    - name: Car Sounds
      area: Work
      weight: medium
      description: "Vehicle audio data collection and automotive sound classification; the Car Sounds team and weekly syncs."
    - name: LARK
      area: Work
      weight: medium
      description: "Merchant card-processing statement analysis: interchange, downgrades, ISOs, proposals, the Sidekick AI assistant."
    - name: Construction Diagram/Doc AI
      area: Work
      weight: low
      description: "Construction-document AI."
    - name: Plaud Sync
      area: Personal
      weight: medium
      description: "Work ON this automation itself: Factotum, the Plaud sync, the planner, prompts, watcher, Claude skills, Notion taxonomy and schema."
    - name: Personal
      area: Personal
      weight: high
      description: "Personal-life notes not tied to work, school or research: memos, health, insurance, errands, budgeting, home, travel, goals, reflections."
    - name: Unknown
      area: Work
      weight: medium
      description: "ONLY a work/academic/research note with no identifiable project. Never for a personal note: that is Personal."
  efforts: [XS, S, M, L]
  # Tie-breakers the sync run applies when a recording could file under two projects.
  tie_breakers: |
    - Prefer the most specific project: construction digital twins are Evidential Deep Learning, not DiCE Lab.
    - SCIBER-CT vs DiCE Lab: the traineeship program (coursework planning, cohort, admin, internship, hackathon) is SCIBER-CT; the lab's research is DiCE Lab. Dr. Akhavian leads both, so his presence decides nothing.
    - A specific course's CONTENT (lectures, assignments, exams, study) is that course (GEOG 582, COMPE 510, BDA 696), Area Academics; only certificate-level matters are SCIBER-CT and only degree-level matters are BDA M.S.
    - Thesis admin (committee, candidacy, BDA 600/799A, defense) is BDA M.S.; thesis research content is its research project.
    - ZIP Launchpad vs Car Sounds: program obligations (workshops, mentors, funding) are ZIP Launchpad; the product and the data work are Car Sounds.
    - If Area is Personal, Project is always Personal, never Unknown.
  # Note page classification (the Notion notes sink's Type and Tags options).
  note_types:
    - { name: Meeting,    description: any multi-person meeting, call or group discussion; prefer Meeting whenever the transcript shows more than one genuine participant }
    - { name: Reminder,   description: a memo whose purpose is to manage the task list or calendar, or a short note-to-self }
    - { name: Goal,       description: goal-setting or objective planning }
    - { name: Research,   description: research thinking, paper discussion, experiment notes }
    - { name: Dev,        description: software design or debugging notes }
    - { name: Client,     description: a client or partner conversation }
    - { name: Lecture,    description: a recorded class session }
    - { name: Coursework, description: assignment or study work for a course }
    - { name: Personal,   description: personal-life content }
  note_tags:
    - { name: Meeting,   description: a multi-person meeting or call }
    - { name: Idea,      description: contains ideas or brainstorming }
    - { name: Task,      description: contains actionable to-dos }
    - { name: Follow-up, description: contains items to circle back on }
    - { name: Personal,  description: contains goals or introspection }

lifecycle:
  fade_days: 21          # undated backlog fades after this many quiet days
  fade_warn_days: 3      # shows in Review this many days before fading
  last_call_days: 7      # hard deadlines this far past due get one Last call, then lapse
  top_cap: 7             # soft cap on the Top rail
  review_cap: 15         # max items per Review session
  expire_time: "03:30"   # when the daily fade / lapse pass runs (local time); only rows Review has shown
  resurrect_on_mention: true

scoring:
  project_weights: { high: 15, medium: 5, low: 0 }
  hard: { overdue: 100, today: 90, d2: 80, d7: 60, d14: 40, later: 20 }
  soft_penalty: 15
  soft_overdue: { start: 70, decay_per_day: 5, floor: 25 }
  undated: 15
  undated_longterm: 10
  mention_bonus: 5
  mention_cap: 15
  owed_bonus: 10
  quick_win: { efforts: [XS, S], within_days: 3, bonus: 5 }
  start_now: { efforts: [L], within_days: 7, bonus: 10 }
  manual: { P0_floor: 85, P1_floor: 65, P3_cap: 40 }
  bands: { P0: 80, P1: 60, P2: 35 }

sources:
  plaud:
    enabled: true
    trigger_account: nthperson.dev@gmail.com   # IMAP creds in .env
    from_filter: plaud.ai                       # IMAP search narrowing (substring)
    sender: no-reply@plaud.ai                   # the parsed From must equal this, and the mail must carry…
    auth_server: mx.google.com                  # …this server's Authentication-Results with DKIM/DMARC pass for its domain
    subject_prefix: "[Plaud-AutoFlow]"
    cli: plaud                                  # @plaud-ai/cli; give the absolute path (`which plaud`): the service has systemd's minimal PATH
    extraction:
      max_undated_per_recording: 3
  canvas:
    enabled: true
    base_url: https://sdsu.instructure.com
    days_back: 7
    days_ahead: 90
    sweep_minutes: 60             # how often items are pulled and submitted ones closed
    course_map: { GEOG582: GEOG 582, COMPE510: COMPE 510, BDA696: BDA 696, SCIBER-CT: SCIBER-CT }
    effort_by_type: { Quiz: S, Discussion: S, Assignment: M, Project: L }
    skip_title_prefixes: ["Attendance:"]
    skip_context_patterns: ["*Arts & Letters*", "*EOP, Outreach*", "*Student Tech*"]
  mail:
    enabled: true
    provider: mailbird            # mailbird | none
    url: https://127.0.0.1:52000/mcp
    tls_verify: false             # Mailbird uses a self-signed certificate on loopback
    sweep_minutes: 20
    # accounts are managed in Settings → Accounts (table `accounts`); these seed it on first run
    seed_accounts:
      - { address: rashe7414@sdsu.edu,      display: SDSU,     roles: [monitor] }
      - { address: robertashe2.0@gmail.com, display: Personal, roles: [monitor, brief_recipient] }
      - { address: nthperson.dev@gmail.com, display: Dev,      roles: [monitor, plaud_trigger] }
    allow: ["*@sdsu.edu", "*@*.sdsu.edu", "*@instructure.com", "*@*.instructure.com", "*"]
    deny:
      - "sdsuathletics@engage.ticketmaster.com"
      - "*San Diego State Athletics*"
      - "police@comms.sdsu.edu"
      - "*Student Health Services*"
      - "sdsubookstore@comms.sdsu.edu"
      - "whp@comms.sdsu.edu"
      - "vpforsacd@comms.sdsu.edu"
      - "president@comms.sdsu.edu"
      - "awongnickerson@comms.sdsu.edu"
      - "gradlife-sdsu.edu@shared1.ccsend.com"
      - "*Arts & Letters Homeroom*"
  slack:
    enabled: false                # Chat and the skills can search and read; never post. Toggle in Settings.
    sweep_minutes: 20             # the mention sweep: @-mentions of you since the last pass become Review items (Settings can override)
    lookback_days: 2              # how far the first pass of a workspace looks back
    max_channels: 40              # joined channels read per workspace per pass (one page of history each)
    workspaces:                   # one entry per workspace; the token lives in .env under the name token_env gives;
                                  # `project` is where a task created from a mention files; `channels: [..]` limits the sweep
      - { name: DiCE Lab,   token_env: SLACK_TOKEN_DICE,      project: DiCE Lab }
      - { name: Car Sounds, token_env: SLACK_TOKEN_CARSOUNDS, project: Car Sounds }
      - { name: LARK dev,   token_env: SLACK_TOKEN_LARK,      project: LARK }
  discord:
    enabled: false                # one bot (DISCORD_BOT_TOKEN in .env) invited to each server below; read-only
    guilds:                       # server ids: Discord → User Settings → Advanced → Developer Mode, then right-click the server → Copy Server ID
      - { name: LARK dev, id: "000000000000000000" }
  calendar:
    enabled: false                # turn on in Settings once credentials exist (docs/SETUP.md §6)
    provider: google              # google | none
    credentials_file: config/google-credentials.json   # OAuth "Desktop app" client, downloaded from Google Cloud
    token_file: config/google-token.json               # written by `python -m factotum google-auth`
    calendar_id: primary
    days_ahead: 14
    sweep_minutes: 30             # how often passed events are checked and the look-ahead refreshed

sinks:
  notion_notes:
    enabled: true
    # 🎙️ Plaud Synced Notes — database id and data source id (both appear in Notion URLs / API)
    database_id: 61e12e128c7f473b94f22641d8a36260
    data_source_id: bbc6c9aa-a96b-4501-a41a-8bd1b5a75866
    source_link_prefix: https://web.plaud.ai/file/
  notion_tasks_mirror:
    enabled: true                 # one-way mirror of every task row; never read back. Toggle in Settings.
    sweep_minutes: 10             # how often rows edited since the last pass are pushed (Settings can override)
    database_id: b1c52e69d3924aea8962bee32440ffbe
    data_source_id: be0b1624-4ea6-43dd-acc2-3a828a8ab07e
    # property names in the Notion Tasks database, in case a user's differ
    properties:
      title: Name
      task_id: Task ID
      status: Status
      project: Project
      area: Area
      due: Due
      hard: Hard deadline
      effort: Effort
      source: Source
      source_key: Source Key
      source_link: Source Link
      context: Context
      why_now: Why now
      score: Score
      priority: Priority
      mentions: Mentions
      completed: Completed
      waiting_on: Waiting On
      calendar_event: Calendar Event
      notes_relation: Notes
    status_map: { open: Next, done: Done, dropped: Dropped, faded: Dropped, lapsed: Dropped }

notify:
  ntfy:
    enabled: true
    server: https://ntfy.sh
    topic: ""                     # e.g. factotum-7f3a9c2e (docs/SETUP.md §4); token in .env
    tap_opens_app: false          # a reminder tap shows the message and its Snooze / Done / Open buttons in ntfy; true = jump straight to the app
  review_time: "19:30"
  snooze_presets: ["30m", "1h", "tomorrow 9am"]
  morning_brief:
    enabled: true
    time: "06:30"
    to: robertashe2.0+planner@gmail.com

claude:
  binary: claude                # absolute path (`which claude`) for the same reason; `factotum claude-check` says which
  models: { sync_file: sonnet, planner_morning: sonnet, chat_turn: sonnet, check: haiku }
  budgets_usd: { sync_file: 1.00, planner_morning: 0.75, chat_turn: 0.60, check: 0.05 }
  planner: { enabled: true }   # the morning brief's verdict and proposals; off = the plain brief
  timeouts_s: { sync_file: 600, planner_morning: 480, chat_turn: 240 }

server:
  host: 127.0.0.1
  port: 8750
  public_url: https://factotum.nthperson.dev
  oauth:                        # claude.ai / Claude Desktop custom connector: Factotum is its own OAuth server (docs/SETUP.md §16)
    enabled: false              # Settings → Connections toggles it; the consent page lists what the connector may do
    consent_gate: cloudflare_access   # the consent page trusts Cf-Access-Authenticated-User-Email ∈ owner.emails; `none` only on a port nobody else reaches
    redirect_uris: ["https://claude.ai/api/mcp/auth_callback", "https://claude.com/api/mcp/auth_callback"]
    access_token_hours: 24
    refresh_token_days: 90
